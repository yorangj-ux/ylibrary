<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c4a8a">
<meta name="description" content="내가 가진 책을 온라인 서재처럼 보고 관리하는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Y's Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 카드목록 헤더 + 필터 바, 아래로 표지 서가 그리드. 책을 누르면 오른쪽(모바일은 아래) 시트로 상세/편집. */
:root {
  --paper: #f2f3ef;
  --surface: #ffffff;
  --ink: #1d2330;
  --muted: #5f6672;
  --line: #d9dcd4;
  --accent: #2c4a8a;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f5;
  --want: #8a5a12; --want-bg: #f6ecd9;
  --reading: #1f6a4f; --reading-bg: #dcefe6;
  --done: #4b4f8a; --done-bg: #e5e6f4;
  --danger: #a3302a;
  --shadow: 0 1px 2px rgba(20,25,35,.08), 0 6px 18px rgba(20,25,35,.08);
  --f-display: "Gowun Batang", "Noto Serif KR", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14171d; --surface: #1c2028; --ink: #e7e9ee; --muted: #9aa1ad; --line: #2d323c;
  --accent: #8fb0f0; --accent-ink: #10151f; --accent-soft: #24304a;
  --want: #e6b56a; --want-bg: #3a2f1d; --reading: #7fd0ad; --reading-bg: #1c3a2f; --done: #b4b7f0; --done-bg: #2a2c4a;
  --danger: #f08a82; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #14171d; --surface: #1c2028; --ink: #e7e9ee; --muted: #9aa1ad; --line: #2d323c;
  --accent: #8fb0f0; --accent-ink: #10151f; --accent-soft: #24304a;
  --want: #e6b56a; --want-bg: #3a2f1d; --reading: #7fd0ad; --reading-bg: #1c3a2f; --done: #b4b7f0; --done-bg: #2a2c4a;
  --danger: #f08a82; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 4vw, 38px); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); }
.rename { border: 0; background: none; padding: 4px; vertical-align: middle; border-radius: 6px; opacity: .45; }
.rename:hover, .rename:focus-visible { opacity: 1; background: var(--accent-soft); }
.sync { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sync[data-state="ok"] .dot { background: var(--reading); }
.sync[data-state="busy"] .dot { background: var(--want); }
.sync[data-state="err"] .dot { background: var(--danger); }
.sync[data-state="ok"], .sync[data-state="busy"] { color: var(--ink); }
.rename svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; display: block; }
.counts { display: flex; gap: 22px; font-variant-numeric: tabular-nums; }
.counts div { display: grid; }
.counts b { font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
.counts span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 16px; }
.search { flex: 1 1 260px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
select.sort { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

.notice { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px; padding-top: 8px; }
.book { display: grid; gap: 8px; background: none; border: 0; padding: 0; text-align: left; }
.cover { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden; box-shadow: var(--shadow); transition: transform .18s ease; }
.book:hover .cover { transform: translateY(-3px); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gen { position: absolute; inset: 0; padding: 14px 12px 12px 18px; display: flex; flex-direction: column; justify-content: space-between; }
.gen::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.18); }
.gen .t { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
.gen .a { font-size: 12px; opacity: .85; }
.gen .rule { height: 1px; background: currentColor; opacity: .35; margin: 8px 0; }
.meta .t { font-weight: 600; font-size: 14px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.meta .a { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
.pill.want { color: var(--want); background: var(--want-bg); }
.pill.reading { color: var(--reading); background: var(--reading-bg); }
.pill.done { color: var(--done); background: var(--done-bg); }
.callno { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.meta .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

.empty { text-align: center; padding: 60px 16px; color: var(--muted); }
.empty h2 { font-family: var(--f-display); color: var(--ink); margin: 0 0 6px; font-size: 22px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,12,18,.45); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 21; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,.2);
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 20px; }
.sheet h2 { font-family: var(--f-display); font-size: 24px; margin: 0; text-wrap: balance; }
.sheet .head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 16px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.detail { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: start; }
.detail .cover { width: 120px; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); font-size: 12px; letter-spacing: .04em; padding-top: 2px; }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.notes { margin-top: 18px; white-space: pre-wrap; background: var(--paper); padding: 12px 14px; border-radius: 8px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.stars { font-size: 16px; letter-spacing: 2px; color: var(--want); }

form.edit { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.field textarea { min-height: 90px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.isbn-row { display: flex; gap: 8px; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; vertical-align: -3px; }
#scanBtn { white-space: nowrap; }
.scanner { display: grid; gap: 8px; margin-top: 8px; }
.scanner .viewport { position: relative; border-radius: 8px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; max-width: 100%; }
.scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner .guide { position: absolute; left: 12%; right: 12%; top: 32%; bottom: 32%; border: 2px solid rgba(255,255,255,.9); border-radius: 6px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.scanner .guide::after { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: #ff5a4f; opacity: .85; }
.isbn-row input { flex: 1; min-width: 0; font-family: var(--f-mono); }
.hint { font-size: 12px; color: var(--muted); min-height: 1em; }
.hint.err { color: var(--danger); }
.coverpick { display: flex; gap: 12px; align-items: center; }
.coverpick .cover { width: 64px; flex: none; }
.coverpick .gen .t { font-size: 9px; } .coverpick .gen .a { display: none; } .coverpick .gen { padding: 6px 5px 5px 9px; } .coverpick .gen .rule { margin: 3px 0; }

textarea.io { width: 100%; min-height: 220px; font-family: var(--f-mono); font-size: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; z-index: 30; font-size: 14px; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
@media (max-width: 520px) {
  .shelf { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 22px 14px; }
  .gen .t { font-size: 14px; }
  .detail { grid-template-columns: 96px 1fr; } .detail .cover { width: 96px; }
  .two { grid-template-columns: 1fr; }
  .counts { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span id="libName">Y's Library</span> <button class="rename" id="renameBtn" aria-label="서재 이름 바꾸기" title="서재 이름 바꾸기"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button></h1>
      <p id="libTagline">내 책장에 꽂힌 책들</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
      <button class="sync" id="syncBtn" hidden><span class="dot"></span><span id="syncLabel">Google Drive 연동</span></button>
      <div class="counts" id="counts"></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제목, 저자, 태그, ISBN으로 찾기" aria-label="검색">
    </div>
    <div class="chips" id="chips" role="group" aria-label="읽기 상태"></div>
    <select id="sort" class="sort" aria-label="정렬">
      <option value="added">최근 추가순</option>
      <option value="title">제목순</option>
      <option value="author">저자순</option>
      <option value="year">출간연도순</option>
    </select>
    <button class="btn primary" id="addBtn">+ 책 추가</button>
  </div>

  <div id="notice"></div>
  <main id="shelf" class="shelf" aria-live="polite"></main>

  <footer>
    <span><span id="storeInfo">이 브라우저에 저장됩니다.</span> <a href="privacy.html" style="color:inherit">개인정보처리방침</a></span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="installBtn" hidden>앱 설치</button>
      <button class="btn ghost" id="exportBtn">내보내기</button>
      <button class="btn ghost" id="importBtn">가져오기</button>
    </span>
  </footer>
</div>

<div id="layer"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
(() => {
  const KEY = 'ys-library-v1';
  const STATUS = { want: '읽고 싶음', reading: '읽는 중', done: '다 읽음' };
  const PALETTES = [
    ['#2f4b3a', '#f1ead8'], ['#7a2e2a', '#f6e7d6'], ['#1f3a5f', '#e9eef6'], ['#c8a24a', '#22201a'],
    ['#4a3b6b', '#efe9f7'], ['#d9d3c4', '#2a2722'], ['#355e6b', '#eaf3f4'], ['#a8552f', '#fbf0e6'],
    ['#26282d', '#e9e4d6'], ['#6b7f4a', '#f4f5ea']
  ];

  const SAMPLE = [
    { title: '소년이 온다', author: '한강', publisher: '창비', year: 2014, status: 'done', rating: 5, tags: ['소설', '한국문학'], location: '거실 책장 2단' },
    { title: '우리가 빛의 속도로 갈 수 없다면', author: '김초엽', publisher: '허블', year: 2019, status: 'reading', tags: ['SF', '단편집'], location: '침대 옆' },
    { title: '사피엔스', author: '유발 하라리', publisher: '김영사', year: 2015, status: 'done', rating: 4, tags: ['인문', '역사'], location: '거실 책장 1단' },
    { title: '피프티 피플', author: '정세랑', publisher: '창비', year: 2016, status: 'want', tags: ['소설', '한국문학'], location: '거실 책장 2단' },
    { title: '살인자의 기억법', author: '김영하', publisher: '문학동네', year: 2013, status: 'done', rating: 4, tags: ['소설'], location: '거실 책장 2단' },
    { title: '코스모스', author: '칼 세이건', publisher: '사이언스북스', year: 2006, status: 'want', tags: ['과학'], location: '서재' },
    { title: '노르웨이의 숲', author: '무라카미 하루키', publisher: '민음사', year: 2013, status: 'reading', tags: ['소설', '일본문학'], location: '서재' }
  ];

  // ---------- storage ----------
  let state = { books: [], sample: false, deleted: {} };
  let memoryOnly = false;
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { state = JSON.parse(raw); state.deleted = state.deleted || {}; return; }
    } catch (e) { memoryOnly = true; }
    state = { books: SAMPLE.map((b, i) => normalize({ ...b, addedAt: Date.now() - (SAMPLE.length - i) * 86400000 })), sample: true, deleted: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); memoryOnly = false; }
    catch (e) { memoryOnly = true; }
    renderStoreInfo();
    if (window.__sync) window.__sync.schedule();
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function normalize(b) {
    return {
      id: b.id || uid(), title: (b.title || '').trim(), author: (b.author || '').trim(),
      publisher: (b.publisher || '').trim(), year: b.year ? Number(b.year) || '' : '',
      isbn: (b.isbn || '').replace(/[^0-9Xx]/g, ''), pages: b.pages ? Number(b.pages) || '' : '',
      status: STATUS[b.status] ? b.status : 'want', rating: Number(b.rating) || 0,
      tags: Array.isArray(b.tags) ? b.tags.filter(Boolean) : String(b.tags || '').split(',').map(s => s.trim()).filter(Boolean),
      location: (b.location || '').trim(), notes: b.notes || '', cover: b.cover || '',
      addedAt: b.addedAt || Date.now(), updatedAt: b.updatedAt || b.addedAt || Date.now()
    };
  }

  // ---------- library name (각 사용자가 바꿀 수 있음) ----------
  const DEFAULT_PROFILE = { name: "Y's Library", tagline: '내 책장에 꽂힌 책들', updatedAt: 0 };
  let profile = { ...DEFAULT_PROFILE };
  try { profile = { ...DEFAULT_PROFILE, ...JSON.parse(localStorage.getItem(KEY + ':profile') || '{}') }; } catch (e) {}
  function applyProfile() {
    document.getElementById('libName').textContent = profile.name;
    document.getElementById('libTagline').textContent = profile.tagline;
    document.getElementById('libTagline').hidden = !profile.tagline;
    document.title = profile.name;
  }
  function saveProfile(p) {
    profile = { name: (p.name || '').trim() || DEFAULT_PROFILE.name, tagline: (p.tagline || '').trim(), updatedAt: p.updatedAt || Date.now() };
    try { localStorage.setItem(KEY + ':profile', JSON.stringify(profile)); } catch (e) {}
    applyProfile();
    if (window.__sync && !p.fromSync) window.__sync.schedule();
  }

  // ---------- helpers ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
  function callNo(b) {
    const a = (b.author || '?').charAt(0); const t = (b.title || '?').charAt(0);
    return `${a}${String(hash(b.author + b.title) % 1000).padStart(3, '0')}${t}`;
  }
  function coverHTML(b) {
    if (b.cover) return `<div class="cover"><img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.parentNode.outerHTML=window.__genCover(${esc(JSON.stringify(b.id))})"></div>`;
    return genCover(b);
  }
  function genCover(b) {
    const [bg, fg] = PALETTES[hash(b.title + b.author) % PALETTES.length];
    return `<div class="cover"><div class="gen" style="background:${bg};color:${fg}"><div><div class="t">${esc(b.title || '제목 없음')}</div><div class="rule"></div></div><div class="a">${esc(b.author)}</div></div></div>`;
  }
  window.__genCover = id => { const b = state.books.find(x => x.id === id); return b ? genCover({ ...b, cover: '' }) : ''; };
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
  }

  // ---------- view state ----------
  let filter = 'all', query = '', sort = 'added';
  try { const v = JSON.parse(localStorage.getItem(KEY + ':view') || '{}'); filter = v.filter || 'all'; sort = v.sort || 'added'; } catch (e) {}
  function saveView() { try { localStorage.setItem(KEY + ':view', JSON.stringify({ filter, sort })); } catch (e) {} }

  function visible() {
    const q = query.toLowerCase().trim();
    let list = state.books.filter(b => filter === 'all' || b.status === filter);
    if (q) list = list.filter(b => [b.title, b.author, b.publisher, b.isbn, b.location, ...b.tags].join(' ').toLowerCase().includes(q));
    const cmp = {
      added: (a, b) => b.addedAt - a.addedAt,
      title: (a, b) => a.title.localeCompare(b.title, 'ko'),
      author: (a, b) => a.author.localeCompare(b.author, 'ko') || a.title.localeCompare(b.title, 'ko'),
      year: (a, b) => (b.year || 0) - (a.year || 0)
    }[sort];
    return list.sort(cmp);
  }

  // ---------- sheet ----------
  function closeSheet() { stopScan(); $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
  function openSheet(html) {

    $('#scanBtn').onclick = () => startScan(code => { form.elements.isbn.value = code; lookup(form, refreshPrev); });

  function shrinkImage(file) {
    return new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const w = 300, h = Math.round(img.height * (w / img.width));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = rej; img.src = url;
    });
  }

  // ---------- 책 정보 찾기 ----------
  // 순서대로 시도: 국립중앙도서관 → 카카오 → Open Library → Google Books. 키가 비어 있는 곳은 건너뛴다.
  // 두 키 모두 공개 페이지에 들어가므로, 발급처에서 사용 한도 외에 비용이 생기지 않는 키만 넣는다.
  const NLK_KEY = '';    // 국립중앙도서관 ISBN 서지정보 API 인증키 (www.nl.go.kr 오픈API)
  const KAKAO_KEY = 'd017d8003eaaf3b737f7d55e509e3523';  // 카카오 REST API 키 (developers.kakao.com)
  const strip = h => String(h || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  const SOURCES = [
    ['국립중앙도서관', NLK_KEY && (async isbn => {
      const j = await (await fetch(`https://www.nl.go.kr/seoji/SearchApi.do?cert_key=${encodeURIComponent(NLK_KEY)}&result_style=json&page_no=1&page_size=1&isbn=${isbn}`)).json();
      const d = j.docs && j.docs[0]; if (!d || !d.TITLE) return null;
      return { title: strip(d.TITLE), author: strip(d.AUTHOR).replace(/^(지은이|글|저자)\s*:\s*/, ''), publisher: strip(d.PUBLISHER),
        year: (d.PUBLISH_PREDATE || d.REAL_PUBLISH_DATE || '').slice(0, 4), pages: parseInt(d.PAGE) || '', cover: (d.TITLE_URL || '').replace(/^http:/, 'https:') };
    })],
    ['카카오', KAKAO_KEY && (async isbn => {
      const j = await (await fetch(`https://dapi.kakao.com/v3/search/book?target=isbn&query=${isbn}`, { headers: { Authorization: 'KakaoAK ' + KAKAO_KEY } })).json();
      const d = j.documents && j.documents[0]; if (!d) return null;
      return { title: d.title, author: (d.authors || []).join(', '), publisher: d.publisher, year: (d.datetime || '').slice(0, 4), cover: d.thumbnail };
    })],
    ['Open Library', async isbn => {
      const o = (await (await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json())['ISBN:' + isbn];
      if (!o) return null;
      return { title: o.title, author: (o.authors || []).map(a => a.name).join(', '), publisher: (o.publishers || [])[0]?.name, year: (o.publish_date || '').match(/\d{4}/)?.[0], pages: o.number_of_pages, cover: o.cover && o.cover.medium };
    }],
    ['Google Books', async isbn => {
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`); if (!r.ok) return null;
      const v = (await r.json()).items?.[0]?.volumeInfo; if (!v) return null;
      return { title: v.title + (v.subtitle ? ' : ' + v.subtitle : ''), author: (v.authors || []).join(', '), publisher: v.publisher, year: (v.publishedDate || '').slice(0, 4), pages: v.pageCount, cover: (v.imageLinks?.thumbnail || '').replace('http:', 'https:') };
    }]
  ].filter(([, fn]) => fn);

  async function lookup(form, refreshPrev) {
    const F = form.elements;
    const isbn = F.isbn.value.replace(/[^0-9Xx]/g, '');
    const hint = $('#lookupHint'); hint.className = 'hint';
    if (isbn.length !== 10 && isbn.length !== 13) { hint.className = 'hint err'; hint.textContent = 'ISBN은 10자리나 13자리 숫자예요.'; return; }
    hint.textContent = '찾는 중…';
    let failed = 0;
    for (const [name, fn] of SOURCES) {
      try {
        const info = await fn(isbn);
        if (!info || !info.title) continue;
        for (const k of ['title', 'author', 'publisher', 'year', 'pages']) if (info[k] && !F[k].value) F[k].value = info[k];
        if (info.cover && !F.cover.value) F.cover.value = info.cover;
        refreshPrev();
        hint.textContent = `${name}에서 찾았어요. 내용을 확인하고 저장하세요.`; return;
      } catch (e) { failed++; }
    }
    hint.className = 'hint err';
    hint.textContent = failed === SOURCES.length ? '지금은 도서 정보 서버에 연결할 수 없어요. 아래에 직접 적어 주세요.' : '이 ISBN으로 등록된 책을 못 찾았어요. 아래에 직접 적어 주세요.';
  }

  function showIO(mode) {
    const json = JSON.stringify({ app: "Y's Library", version: 1, exportedAt: new Date().toISOString(), profile, books: state.books }, null, 2);
    openSheet(mode === 'export' ? `
      <div class="head"><h2>내보내기</h2><button class="x" data-close aria-label="닫기">×</button></div>
      <p>책 ${state.books.length}권의 정보예요. 파일로 받거나, 아래 내용을 복사해 보관하세요.</p>
      <textarea class="io" id="ioText" readonly>${esc(json)}</textarea>
      <div class="actions"><button class="btn primary" id="dl">파일로 받기</button><button class="btn" id="copy">복사</button></div>
      <p class="hint" id="ioHint"></p>` : `
      <div class="head"><h2>가져오기</h2><button class="x" data-close aria-label="닫기">×</button></div>
      <p>내보낸 파일을 고르거나 내용을 붙여 넣으세요. 같은 책은 건너뛰고 새 책만 더해요.</p>
      <textarea class="io" id="ioText" placeholder='{"books": [...]}'></textarea>
      <div class="actions"><button class="btn primary" id="doImport">가져오기</button><button class="btn" id="pickFile">파일 고르기</button></div>

    if (mode === 'export') {

      };
      $('#copy').onclick = () => {
        navigator.clipboard.writeText(json).then(() => toast('복사했어요'), () => { $('#ioText').select(); $('#ioHint').textContent = '전체 선택했어요. Ctrl+C(⌘C)로 복사하세요.'; });
      };
    } else {
      $('#pickFile').onclick = () => $('#fileImport').click();
      $('#doImport').onclick = () => importJSON($('#ioText').value);
    }
  }
  function importJSON(text) {
    try {
      const data = JSON.parse(text); const books = Array.isArray(data) ? data : data.books;
      if (!Array.isArray(books)) throw new Error();
      if (data.profile && data.profile.name) saveProfile(data.profile);
      if (state.sample) { state.books = []; state.sample = false; }
      const seen = new Set(state.books.map(b => b.id)); const key = b => (b.isbn || '') + '|' + b.title + '|' + b.author;
      const seenKey = new Set(state.books.map(key)); let n = 0;
      books.forEach(raw => { const b = normalize(raw); if (!b.title || seen.has(b.id) || seenKey.has(key(b))) return; state.books.push(b); seen.add(b.id); seenKey.add(key(b)); n++; });
      save(); render(); closeSheet(); toast(`${n}권을 더했어요`);
    } catch (e) { $('#ioHint').className = 'hint err'; $('#ioHint').textContent = '형식을 읽을 수 없어요. 이 앱에서 내보낸 JSON인지 확인해 주세요.'; }
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-close]'); if (!t) return;
    if (t.matches('[data-close]')) return closeSheet();
    if (t.dataset.f) { filter = t.dataset.f; saveView(); return render(); }

      state.books = state.books.filter(x => x.id !== t.dataset.del); state.deleted[t.dataset.del] = Date.now(); save(); render(); closeSheet(); return toast('삭제했어요');
    }
    if (t.id === 'clearSample') { state = { books: [], sample: false, deleted: {} }; save(); render(); return toast('예시를 비웠어요'); }

  $('#q').addEventListener('input', e => { query = e.target.value; render(); });

  $('#addBtn').onclick = () => showForm();

  // ---------- ISBN 바코드 인식 ----------
  // 브라우저에 BarcodeDetector가 있으면 그것을 쓰고(안드로이드 Chrome 등), 없으면 vendor/의 ZXing을 불러와 쓴다(iPhone 등).
  let scanStream = null, scanTimer = null, decoder = null;
  function validIsbn13(c) {
    if (!/^97[89]\d{10}$/.test(c)) return false;
    const sum = [...c].slice(0, 12).reduce((a, d, i) => a + Number(d) * (i % 2 ? 3 : 1), 0);
    return (10 - sum % 10) % 10 === Number(c[12]);
  }
  function loadScript(src) {
    return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  }
  async function getDecoder() {
    if (decoder) return decoder;
    if ('BarcodeDetector' in window) {
      try {
        const formats = await BarcodeDetector.getSupportedFormats();
        if (formats.includes('ean_13')) {
          const d = new BarcodeDetector({ formats: ['ean_13'] });
          return decoder = async canvas => (await d.detect(canvas)).map(r => r.rawValue);
        }
      } catch (e) {}
    }
    if (!window.ZXing) await loadScript('vendor/zxing-0.21.3.min.js');
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
    return decoder = async canvas => {
      try {
        const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)));
        return [reader.decode(bmp).getText()];
      } catch (e) { return []; } finally { reader.reset(); }
    };
  }
  const pick = codes => codes.find(validIsbn13);
  async function startScan(onCode) {
    const box = $('#scanner'); box.hidden = false; const hint = $('#scanHint');
    hint.className = 'hint'; hint.textContent = '카메라를 켜는 중…';
    let decode;
    try { decode = await getDecoder(); } catch (e) { hint.className = 'hint err'; hint.textContent = '바코드 인식기를 불러오지 못했어요. 인터넷 연결을 확인하거나 ISBN을 직접 적어 주세요.'; return; }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      hint.className = 'hint err';
      hint.textContent = '카메라를 쓸 수 없어요. 카메라 권한을 허용하거나 ‘사진 찍어서 인식’을 눌러 주세요.';
      $('#scanVideo').closest('.viewport').hidden = true; return;
    }
    const video = $('#scanVideo'); video.closest('.viewport').hidden = false;
    video.srcObject = scanStream; await video.play().catch(() => {});
    hint.textContent = '책 뒤표지의 바코드(978…)를 네모 안에 맞춰 주세요.';
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tick = async () => {
      if (!scanStream) return;
      if (video.videoWidth) {
        // 가이드 상자 부분만 잘라 인식 (빠르고 정확)
        const w = video.videoWidth, h = video.videoHeight;
        canvas.width = Math.round(w * 0.8); canvas.height = Math.round(h * 0.45);
        ctx.drawImage(video, w * 0.1, h * 0.275, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
        const code = pick(await decode(canvas));
        if (code) { if (navigator.vibrate) navigator.vibrate(60); stopScan(); toast(`ISBN ${code} 인식`); return onCode(code); }
      }
      scanTimer = setTimeout(tick, 180);
    };
    tick();
  }
  function stopScan() {
    clearTimeout(scanTimer); scanTimer = null;
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    const box = document.getElementById('scanner'); if (box) box.hidden = true;
  }
  async function scanPhoto(file, onCode) {
    const hint = $('#scanHint'); hint.className = 'hint'; hint.textContent = '사진에서 바코드를 찾는 중…';
    try {
      const decode = await getDecoder();
      const img = new Image(); const url = URL.createObjectURL(file);
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently: true });
      for (const maxW of [1600, 1000, 2400]) {
        const k = Math.min(1, maxW / img.width); canvas.width = Math.round(img.width * k); canvas.height = Math.round(img.height * k);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const code = pick(await decode(canvas));
        if (code) { URL.revokeObjectURL(url); stopScan(); toast(`ISBN ${code} 인식`); return onCode(code); }
      }
      URL.revokeObjectURL(url);
      hint.className = 'hint err'; hint.textContent = '사진에서 ISBN 바코드를 찾지 못했어요. 바코드가 화면을 가로로 가득 채우게 다시 찍어 주세요.';
    } catch (e) { hint.className = 'hint err'; hint.textContent = '사진을 읽지 못했어요. 다시 시도하거나 ISBN을 직접 적어 주세요.'; }
  }

  // ---------- install (PWA) ----------
  const isApp = !!document.querySelector('link[rel="manifest"]');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#installBtn').hidden = false; });
  window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('앱을 설치했어요'); });
  if (isApp && isIOS && !standalone) $('#installBtn').hidden = false;
  $('#installBtn').onclick = async () => {
    if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $('#installBtn').hidden = true; return; }
    openSheet(`<div class="head"><h2>홈 화면에 설치하기</h2><button class="x" data-close aria-label="닫기">×</button></div>
      <p>Safari 아래쪽의 <b>공유</b> 버튼을 누르고 <b>홈 화면에 추가</b>를 고르세요. 그러면 앱처럼 열리고, 인터넷이 없어도 서재를 볼 수 있어요.</p>`);
  };

  // ---------- Google Drive 연동 ----------
  // 각 사용자의 Drive '앱 전용 숨김 폴더'(appDataFolder)에 library.json 하나를 둔다.
  // 배포하는 사람은 Google Cloud에서 만든 OAuth 클라이언트 ID를 여기에 넣는다. 비어 있으면 연동 버튼이 숨겨진다.
  const GOOGLE_CLIENT_ID = '354107825240-e3q653kj60ceqr374uoffr4ludrtgm79.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  const FILE = 'library.json';
  const syncKey = KEY + ':sync';
  let sync = { linked: false, lastSync: 0 };
  try { sync = { ...sync, ...JSON.parse(localStorage.getItem(syncKey) || '{}') }; } catch (e) {}
  const saveSync = () => { try { localStorage.setItem(syncKey, JSON.stringify(sync)); } catch (e) {} };
  let token = null, tokenExp = 0, tokenClient = null, timer = null, busy = false, again = false;

  function setSyncUI(st, label) {
    const b = $('#syncBtn'); b.dataset.state = st; $('#syncLabel').textContent = label;
  }
  function idleLabel() {
    if (!sync.linked) return setSyncUI('', 'Google Drive 연동');
    if (token && Date.now() < tokenExp) return setSyncUI('ok', sync.lastSync ? `Drive 동기화됨 · ${new Date(sync.lastSync).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' })}` : 'Drive 연결됨');
    setSyncUI('', '눌러서 Drive와 맞추기');
  }
  function loadGIS() {
    return new Promise((res, rej) => {
      if (window.google && google.accounts) return res();
      const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = res; sc.onerror = () => rej(new Error('gis')); document.head.appendChild(sc);
    });
  }
  async function getToken(interactive) {
    if (token && Date.now() < tokenExp - 60000) return token;
    if (!interactive) return null;
    await loadGIS();
    return new Promise((res, rej) => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: SCOPE,
        callback: r => { if (r.error) return rej(new Error(r.error)); token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000; res(token); },
        error_callback: e => rej(new Error(e.type || 'popup'))
      });
      tokenClient.requestAccessToken({ prompt: sync.linked ? '' : 'consent' });
    });
  }
  async function api(path, opts = {}) {
    const r = await fetch('https://www.googleapis.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
    if (r.status === 401) { token = null; throw new Error('auth'); }
    if (!r.ok) throw new Error('http ' + r.status);
    return r;
  }
  function merge(local, remote) {
    const deleted = { ...(remote.deleted || {}) };
    for (const [id, t] of Object.entries(local.deleted || {})) deleted[id] = Math.max(deleted[id] || 0, t);
    const byId = new Map();
    for (const b of [...(remote.books || []), ...local.books]) {
      const cur = byId.get(b.id);
      if (!cur || (b.updatedAt || 0) > (cur.updatedAt || 0)) byId.set(b.id, b);
    }
    const books = [...byId.values()].filter(b => !(deleted[b.id] && deleted[b.id] >= (b.updatedAt || 0))).map(normalize);
    const rp = remote.profile || { updatedAt: 0 };
    return { books, deleted, profile: (rp.updatedAt || 0) > (profile.updatedAt || 0) ? rp : profile };
  }
  async function runSync(interactive) {
    if (busy) { again = true; return; }
    busy = true; setSyncUI('busy', 'Drive와 맞추는 중…');
    try {
      if (!(await getToken(interactive))) { busy = false; return idleLabel(); }
      const list = await (await api(`/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=${encodeURIComponent(`name='${FILE}'`)}`)).json();
      const fileId = list.files && list.files[0] && list.files[0].id;
      const remote = fileId ? await (await api(`/drive/v3/files/${fileId}?alt=media`)).json() : { books: [], deleted: {} };
      const local = state.sample ? { books: [], deleted: {} } : state;
      const m = merge(local, remote);
      if (!(state.sample && !m.books.length)) state = { books: m.books, deleted: m.deleted, sample: false };
      if (m.profile !== profile) saveProfile({ ...m.profile, fromSync: true });
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      const body = JSON.stringify({ app: "Y's Library", version: 1, profile, books: state.sample ? [] : state.books, deleted: state.deleted, savedAt: Date.now() });
      if (fileId) {
        await api(`/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
      } else {
        const fd = new FormData();
        fd.append('metadata', new Blob([JSON.stringify({ name: FILE, parents: ['appDataFolder'] })], { type: 'application/json' }));
        fd.append('file', new Blob([body], { type: 'application/json' }));
        await api('/upload/drive/v3/files?uploadType=multipart', { method: 'POST', body: fd });
      }
      sync.linked = true; sync.lastSync = Date.now(); saveSync();
      render(); idleLabel();
    } catch (e) {
      const msg = e.message === 'gis' || e.message === 'Failed to fetch' ? '인터넷 연결을 확인해 주세요'
        : e.message === 'auth' ? '다시 로그인이 필요해요' : /popup/.test(e.message) ? '로그인 창이 닫혔어요' : 'Drive와 맞추지 못했어요';
      setSyncUI('err', msg);
    }
    busy = false;
    if (again) { again = false; runSync(false); }
  }
  function showSyncSheet() {
    if (!sync.linked) {
      return openSheet(`<div class="head"><h2>Google Drive 연동</h2><button class="x" data-close aria-label="닫기">×</button></div>
        <p>Google 계정으로 로그인하면 서재가 <b>내 Google Drive</b>의 앱 전용 숨김 폴더에 저장돼요. 휴대폰, 컴퓨터 등 같은 계정으로 로그인한 기기끼리 서재가 맞춰져요.</p>
        <p class="hint">이 앱은 자기 전용 폴더만 볼 수 있고, Drive의 다른 파일은 보지 못해요. 기기에 있던 책과 Drive의 책은 합쳐져요.</p>
        <div class="actions"><button class="btn primary" id="doLink">Google로 로그인</button></div>`);
    }
    openSheet(`<div class="head"><h2>Google Drive 연동</h2><button class="x" data-close aria-label="닫기">×</button></div>
      <p>${sync.lastSync ? `마지막으로 맞춘 시각: ${new Date(sync.lastSync).toLocaleString('ko-KR')}` : '아직 맞춘 적이 없어요.'}</p>
      <p class="hint">책을 추가하거나 고치면 몇 초 뒤 자동으로 Drive에 저장돼요. 앱을 새로 열면 ‘지금 맞추기’를 한 번 눌러 주세요.</p>
      <div class="actions"><button class="btn primary" id="doSync">지금 맞추기</button><button class="btn ghost" id="unlink">이 기기 연동 끊기</button></div>`);
  }
  window.__sync = {
    schedule() { if (!sync.linked || !token) return; clearTimeout(timer); timer = setTimeout(() => runSync(false), 3000); }
  };
  if (GOOGLE_CLIENT_ID && isApp) { $('#syncBtn').hidden = false; idleLabel(); }
  $('#syncBtn').onclick = () => (sync.linked && !(token && Date.now() < tokenExp)) ? runSync(true) : showSyncSheet();
  document.addEventListener('click', e => {
    if (e.target.id === 'doLink' || e.target.id === 'doSync') { closeSheet(); runSync(true); }
    if (e.target.id === 'unlink') {
      if (token && window.google) google.accounts.oauth2.revoke(token, () => {});
      token = null; sync = { linked: false, lastSync: 0 }; saveSync(); closeSheet(); idleLabel(); toast('이 기기의 연동을 끊었어요. 책은 그대로 남아 있어요.');
    }
  });

  if (isApp && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (isApp && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  load(); applyProfile(); render();
})();
</script>
</body>
